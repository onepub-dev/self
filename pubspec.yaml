name: self
description: The Self package provides utility classes to make it easy
  to create Self extracting executables that ship with resources
  or need to run on boot.
repository: https://github.com/onepub-dev/self
  
version: 0.8.1

environment:
  sdk: ^3.8.0

dependencies:
  dcli: ^10.0.0
  dcli_core: ^10.0.0
  path: ^1.9.1

dev_dependencies:
  args: ^2.7.0
  date_time_format: ^2.0.1
  lint_hard: ^8.0.1
  logging: ^1.3.0
  test: ^1.24.0

platforms:
  linux:
  windows:
  macos:
